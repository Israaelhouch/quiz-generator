# Pre-commit hooks — the fast half of the CI gate, run before the commit
# exists (CLAUDE.md §8: gitleaks in pre-commit and CI).
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files      # first run, to see where you stand
#
# mypy and pytest are deliberately NOT here: they need the project's own
# environment, and a slow pre-commit hook is a hook people bypass. CI runs
# them; `make lint` runs them locally.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]        # models and corpora belong outside git (§7)
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
