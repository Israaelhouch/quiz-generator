# Tooling configuration for quiz-ai.
#
# This file configures ruff, mypy, pytest and coverage. It deliberately does
# NOT declare a build backend yet: the package lives at `src/quiz_generator`
# and is imported by putting `src` on the path (pytest's `pythonpath` below,
# `PYTHONPATH` in the Makefile, run_local.sh and the Dockerfile). Turning the
# repository into an installed distribution is a change to how the project is
# built, so it belongs in its own commit.

# ---------------------------------------------------------------------------
# ruff — format + lint (CLAUDE.md §3)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = [".venv", "data", "notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "ARG",  # unused arguments
    "T20",  # flake8-print
]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI's Depends() in defaults is the framework idiom
    "RUF001",  # ambiguous unicode: the corpus is Arabic and French by design
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# CLIs, pipelines and eval harnesses print to stdout — that is their output
# contract, not stray debugging (CLAUDE.md §3).
"src/quiz_generator/pipeline/__main__.py" = ["T20"]
"src/quiz_generator/api/__main__.py" = ["T20"]
"src/quiz_generator/ingestion/*.py" = ["T20"]
# Ad-hoc query tools with `__main__` blocks; stdout is their output contract.
"src/quiz_generator/indexing/query.py" = ["T20", "E741"]
"src/quiz_generator/retrieval/query.py" = ["T20", "E741"]
"scripts/**" = ["T20"]
# Tests reach into private helpers on purpose and assert on magic values.
# E402: the suite scrubs API_KEYS / RATE_LIMIT_PER_MINUTE out of the
# environment *before* importing quiz_generator.api.server, because the CORS middleware
# is installed at import time. The import order is the point — see the module
# docstring in tests/test_api.py.
"tests/**" = ["ARG", "T20", "E402", "RUF059", "B007", "E741", "RUF005"]

# -- RATCHET (CLAUDE.md §10.2) ---------------------------------------------
# Pre-existing violations, allow-listed so CI fails on NEW ones. This block
# only ever shrinks; adding to it needs a justification in the PR description.
# Counts are as of the commit that introduced this file.
# src/ — behaviour-adjacent, so deliberately NOT fixed in the tooling PR that
# introduced this file. Each needs its own change with its own test.
"src/quiz_generator/indexing/config.py" = ["F821"]              # 1 — ADR-0001: return annotation
                                                 #     names a class defined inside
                                                 #     the function body. Never
                                                 #     evaluated at runtime, so it
                                                 #     does not raise; it is still
                                                 #     unresolvable for mypy.
"src/quiz_generator/api/server.py" = ["B904", "ARG001"]         # 5 + 2 — B904: exception chaining
                                                 #     inside the HTTP translation
                                                 #     layer changes what is logged.
                                                 #     ARG001: FastAPI hands every
                                                 #     exception handler (request,
                                                 #     exc); the signature is the
                                                 #     framework's, not ours.
"src/quiz_generator/retrieval/retriever.py" = ["SIM103"]           # 1
"src/quiz_generator/indexing/build.py" = ["T20"]
"src/quiz_generator/retrieval/compare_rerank.py" = ["T20", "E741", "C408"]  # 2
"src/quiz_generator/pipeline/cli.py" = ["T20", "E741"]               # 1 (T20 above is the CLI rule)

# scripts/ and tests/ — cosmetic only.
"scripts/eval/run_retriever_eval.py" = ["T20", "E741"]
"scripts/evaluate_runs.py" = ["T20", "RUF005"]
"scripts/analyze_runs.py" = ["T20", "RUF046"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# mypy — strict on src/ (CLAUDE.md §3)
# ---------------------------------------------------------------------------
# Strict is the target, not yet the reality. Modules that do not pass are
# listed in the ratchet block at the bottom of this section with the specific
# error codes they still emit. The rule (CLAUDE.md §10.2) is that the
# allow-list only ever shrinks: adding a module to it requires a note in the
# PR description saying why.
[tool.mypy]
python_version = "3.11"
files = ["src"]
# The package base is `src`, so modules are `quiz_generator.*`, not
# `src.quiz_generator.*` — which is what the per-module ratchet below names.
mypy_path = "src"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true

# Third-party packages without bundled type information. Ignoring their
# *imports* is not the same as ignoring our own types at the call site.
[[tool.mypy.overrides]]
# Both the bare name and the `.*` form are listed: `foo.*` does not reliably
# match `foo` itself, and CI installs only the light dependency set (the test
# suite mocks every heavy adapter), so these are genuinely absent there.
module = [
    "chromadb",
    "chromadb.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "uvicorn",
    "google",
    "google.*",
    "torch",
    "torch.*",
    "langdetect.*",
    "pylatexenc.*",
    "groq.*",
    "ollama.*",
    "google.genai.*",
    "sklearn.*",
    "faiss.*",
    "pandas.*",
    "yaml.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest (CLAUDE.md §4)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# `src` makes `quiz_generator` importable; "." makes `scripts` importable.
# Replaces the sys.path block that every test file used to carry.
pythonpath = ["src", "."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs a real vector store / model on disk",
    "e2e: drives a running API",
    "slow: takes more than a couple of seconds",
]
filterwarnings = ["error::DeprecationWarning:quiz_generator.*"]

# ---------------------------------------------------------------------------
# coverage (CLAUDE.md §4 — floor of 80% on the logic modules)
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/quiz_generator"]
branch = true
omit = ["*/__main__.py", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# mypy RATCHET (CLAUDE.md §10.2)
# ---------------------------------------------------------------------------
# `strict = true` above is the standard. These per-module blocks record where
# the codebase does not meet it yet, so CI can fail on NEW violations today
# rather than waiting for a big-bang typing sweep.
#
# Rules for this block:
#   * It only ever shrinks. Adding a module or a code needs a line in the PR
#     description saying why.
#   * Deleting an entry is a normal, welcome PR — fix the module, drop its
#     block, watch CI stay green.
#
# Baseline at introduction: 93 errors in 23 files (46 source files checked).
#   58 type-arg        bare `dict` / `list` annotations, no parameters
#   12 no-untyped-def  missing signatures, mostly on FastAPI handlers
#    7 assignment      lazy-import `_client = None` rebound to a real client
#    5 no-any-return   returning Any out of a typed function
#    3 no-untyped-call / 3 arg-type / 2 unreachable / 1 each return-value,
#      name-defined, import-untyped
#
# Three of those entries were findings rather than debt, and have since been
# fixed and removed from this block — see docs/DECISIONS.md ADR-0001:
#   * `unreachable` in data.curriculum_rules / data.domain_rules: annotations
#     widened to Sequence[str | None], because normalize_row hands these
#     functions an unvalidated json.loads result.
#   * `arg-type` in pipeline.orchestrator: generate_detailed now declares the
#     same Literal aliases GenerationRequest validates against.
#   * B905 (ruff) in retriever / reranker / indexing: the reranker case was a
#     real silent-truncation bug; the rest are now explicit assertions.
#
# What remains here is ordinary debt: missing annotations and bare generics.
[[tool.mypy.overrides]]
module = "quiz_generator.api.observability"
disable_error_code = ["type-arg"]  # 1 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.api.server"
disable_error_code = ["no-untyped-def", "type-arg"]  # 12 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.ingestion.build_index_text"
disable_error_code = ["no-untyped-def", "type-arg"]  # 2 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.ingestion.filters"
disable_error_code = ["type-arg"]  # 4 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.ingestion.ingest"
disable_error_code = ["type-arg"]  # 4 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.shared.latex"
disable_error_code = ["type-arg"]  # 1 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.ingestion.normalize"
disable_error_code = ["arg-type", "no-untyped-def", "type-arg"]  # 11 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.generation.generator"
disable_error_code = ["type-arg"]  # 1 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.generation.llm_client"
disable_error_code = ["assignment", "no-any-return", "no-untyped-call", "no-untyped-def", "type-arg"]  # 17 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.generation.prompts.strings"
disable_error_code = ["type-arg"]  # 1 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.indexing.build"
disable_error_code = ["import-untyped", "no-untyped-def", "type-arg"]  # 5 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.indexing.config"
disable_error_code = ["name-defined"]  # 1 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.indexing.embedding_model"
disable_error_code = ["no-any-return", "no-untyped-def", "return-value"]  # 3 error(s)  # + no-any-return: this module reports
# return-value when sentence_transformers is installed and no-any-return when it
# is not. Both are listed so the gate gives the same verdict in CI (light deps)
# and locally (full deps).

[[tool.mypy.overrides]]
module = "quiz_generator.indexing.query"
disable_error_code = ["type-arg"]  # 3 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.indexing.taxonomy"
disable_error_code = ["type-arg"]  # 1 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.indexing.vector_store"
disable_error_code = ["no-any-return", "type-arg"]  # 3 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.pipeline.cli"
disable_error_code = ["type-arg"]  # 7 error(s)


[[tool.mypy.overrides]]
module = "quiz_generator.retrieval.compare_rerank"
disable_error_code = ["type-arg"]  # 4 error(s)

[[tool.mypy.overrides]]
module = "quiz_generator.retrieval.query"
disable_error_code = ["type-arg"]  # 1 error(s)

[[tool.mypy.overrides]]
